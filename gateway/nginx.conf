# A hash sign starts a comment. nginx ignores these lines.
# This file is the Strangler Fig. It decides which system answers each request.

# Give the new Catalog service a short name we can use below.
# "catalog" is the service name from docker-compose.yml, port 8080 inside it.
upstream new_catalog {
  server catalog:8080;
}

# Give the old system a short name too.
upstream old_core {
  server legacy:80;
}

server {
  # Listen on the normal web port inside this container.
  listen 80;

  # ---- THE STRANGLER ROUTE ----
  # Any address that starts with /v1/items/ goes to the NEW service.
  # This is the one branch we have moved so far.
  location /v1/items/ {
    # Send the request on to the new catalog.
    proxy_pass http://new_catalog;
    # Pass on the original address the shopper asked for.
    proxy_set_header Host $host;
    # Tell the service the real address of the shopper.
    proxy_set_header X-Real-IP $remote_addr;
    # Add a header so we can prove, in the browser, which system answered.
    add_header X-Northline-Route "new-catalog" always;
    # Do not wait longer than 2 seconds for the new service.
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
  }

  # ---- EVERYTHING ELSE ----
  # Every other address still goes to the old system, exactly as before.
  location / {
    # Send the request on to the old system.
    proxy_pass http://old_core;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # A header so we can prove the old system answered.
    add_header X-Northline-Route "legacy-core" always;
  }
}
